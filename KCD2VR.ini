; Starter profile based on the supplied exit settings and calibration.
; Keep your installed INI when updating. The launcher keeps existing values.
; Alchemy speed applies to qualified Henry handling; work follows gestures.
; Historical compatibility keys below retain the current supplied values.
; Use the VR menu for everyday tuning. Keep the existing game-side INI and
; calibration when updating; this sample is not an automatic reset.
; true/false and 1/0 are existing boolean forms. Units are noted where relevant.
; Unrecognized keys are ignored; omitted values use the loader's defaults.
; Migration markers apply a requested revision default once; later edits stay saved.
; Experimental requests still need the matching native owner and any required
; companion assets. A true value is not a claim of headset-verified behavior.

